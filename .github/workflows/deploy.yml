name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hakyll
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - name: Cache stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            hakyll/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('hakyll/stack.yaml', 'hakyll/stack.yaml.lock', 'hakyll/package.yaml') }}
          restore-keys: stack-${{ runner.os }}-

      - name: Build site generator
        run: stack build --install-ghc

      - name: Build site
        run: stack exec -- site build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hakyll/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
