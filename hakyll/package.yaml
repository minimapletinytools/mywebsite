name:                mywebsite
version:             0.1.0.0
license:             BSD3
author:              "Peter Lu"
copyright:           "2018 Peter Lu"
description:         static site generator for pdlla.org

ghc-options:
- -Wall
- -Wcompat

dependencies:
- base >= 4.7 && < 5
- hakyll >= 4.17
- bytestring
- directory
- filepath
- network-uri
- text

executables:
  site:
    main:                site.hs
    source-dirs:         ./
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
