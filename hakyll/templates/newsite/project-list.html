<div>
	$if(posts)$
		$for(posts)$
			$if(thumbnail)$
				<a href="$url$">
					<img class="projectlistimg" width = "200" src="/images/$thumbnail$" alt="" />
				</a>
				<!--<p>$title$</p>-->
			$else$
				<a class="" href="$url$">
					<p>$date$ -:- $title$</p>
				</a>
			$endif$
		$endfor$
	$endif$
</div>
